name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  # Design D5: prove the GENERATED project is green by scaffolding it from this
  # very CLI and running its full quality gate (install → check → format:check → build).
  generation-gate:
    name: Generated project gate
    runs-on: ubuntu-latest
    env:
      RUN_GENERATION_GATE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: bun install --frozen-lockfile
      - run: bun run test

  package:
    name: npm pack check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm pack --dry-run
