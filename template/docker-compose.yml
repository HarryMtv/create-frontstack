services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules # don't shadow the container's node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # reliable HMR under Docker
    command: pnpm dev --host 0.0.0.0
